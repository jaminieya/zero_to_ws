const TRX=(function(){
  if(!LOC||!LOC.dict)return null;
  /* 1) 문장 전체가 사전 키와 같으면 그대로 바꾼다
     2) 문장 전체가 {0} 자리표시자 키 하나와 맞으면 채워 넣는다
     3) 아니면 가장 긴 조각부터 차례로 바꾼다 */
  const HAN=/[가-힣]/,cache=new Map(),stat=new Map(),tpl=[],items=[];
  const esc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const LGRE=RULE.lg!=='KBO'?/KBO/g:null;
  for(const k in LOC.dict){
    const v=LOC.dict[k];
    if(!/\{\d\}/.test(k)){stat.set(k,v);items.push({k,v,lit:k.length,re:esc(k),n:0});continue}
    const parts=k.split(/(\{\d\})/).filter(x=>x!=='');
    const lit=k.replace(/\{\d\}/g,'').replace(/\s/g,'').length,short=lit<2;
    const ids=[];let full='',part='';
    parts.forEach((x,i)=>{
      const m=x.match(/^\{(\d)\}$/);
      if(!m){full+=esc(x);part+=esc(x);return}
      ids.push(+m[1]);
      const edge=i===0||i===parts.length-1;
      full+='(.*?)';
      part+=short?'([0-9A-Za-z.,:/+\\-]+)':edge?'([^\\s·:<>()\\[\\]]+)':'(.+?)';
    });
    const t={k,v,ids,lit,full:new RegExp('^'+full+'$'),re:part,n:ids.length};
    tpl.push(t);items.push(t);
  }
  tpl.sort((a,b)=>b.lit-a.lit);
  items.sort((a,b)=>b.lit-a.lit);
  const BIG=new RegExp(items.map(x=>'('+x.re+')').join('|'),'g');
  const fill=(t,g)=>t.v.replace(/\{(\d)\}/g,(_,n)=>{const i=t.ids.indexOf(+n);return i<0?'':tr(g[i])});
  function core(str){
    const lead=str.match(/^\s*/)[0],tail=str.match(/\s*$/)[0],body=str.trim();
    if(!body)return str;
    if(stat.has(body))return lead+stat.get(body)+tail;
    /* 맞는 후보를 모두 만들어 보고, 한국어가 가장 적게 남는 결과를 고른다 */
    const left=x=>(x.match(/[가-힣]/g)||[]).length;
    let best=null,bl=1e9;
    for(const t of tpl){
      const m=body.match(t.full);if(!m)continue;
      const o=fill(t,m.slice(1)),l=left(o);
      if(l<bl){best=o;bl=l;if(!l)break}
    }
    if(best!=null&&!bl)return lead+best+tail;
    const big=piece(str);
    return best!=null&&bl<left(big)?lead+best+tail:big;
  }
  function piece(str){
    return str.replace(BIG,(...m)=>{
      let gi=1;
      for(const it of items){
        if(m[gi]!==undefined)return it.n?fill(it,m.slice(gi+1,gi+1+it.n)):it.v;
        gi+=1+it.n;
      }
      return m[0];
    });
  }
  function tr(str){
    if(str==null)return str;str=String(str);
    if(!HAN.test(str))return LGRE?str.replace(LGRE,RULE.lg):str;
    if(cache.has(str))return cache.get(str);
    let out=core(str);
    if(LGRE)out=out.replace(LGRE,RULE.lg);
    cache.set(str,out);return out;
  }
  const skip=n=>{const e=n.parentElement;return !e||/^(SCRIPT|STYLE)$/.test(e.tagName)||e.closest('[data-notr]')};
  const tn=n=>{if(skip(n))return;const v=n.nodeValue;if(!v)return;const t=tr(v);if(t!==v)n.nodeValue=t;if(window.TR_MISS&&HAN.test(t))window.TR_MISS.add(t)};

  CP.measureText=function(t){return mt.call(this,tr(t))};
  const al=window.alert.bind(window),pr=window.prompt.bind(window);
  window.alert=m=>al(tr(m));window.prompt=(m,d)=>pr(tr(m),d);
  document.title=tr(document.title);
  return tr;
})();

/* 유형별 능력치 범위 [최소, 최대]. 범위 안에서 뽑은 뒤 합계 225(OVR 45)로 맞춘다.
   투수 (구속 · 제구 · 구위 · 체력 · 회복력)
   구속: 강속구형 > 기교파 > 제구형      제구: 제구형 > 기교파 > 강속구형
   구위: 강속구형 >= 기교파 > 제구형     체력·회복력: 대체로 기교파 > 제구형 > 강속구형 (보직이 갈리도록 범위가 겹친다)
   타자 (컨택 · 파워 · 선구안 · 주루 · 수비)
   컨택트는 컨택, 슬러거는 파워가 높다. 주루·수비는 넓게 잡아 수비 위치가 갈리도록 한다 */
const STAT_RANGE={
  PW:[[55,61],[29,35],[49,55],[36,46],[34,44]],
  CT:[[36,41],[53,59],[40,44],[40,50],[37,46]],
  FN:[[42,47],[41,46],[45,49],[43,53],[40,50]],
  CO:[[52,60],[30,38],[44,52],[40,58],[30,52]],
  BA:[[42,48],[42,48],[42,48],[34,56],[34,56]],
  SL:[[34,42],[56,64],[43,51],[28,46],[32,54]]
};
function rollRange(rg){
  const st=rg.map(([a,b])=>RI(a,b));let d=225-st.reduce((x,y)=>x+y,0),g=0;
  while(d!==0&&g++<5000){const i=RI(0,4),sg=d>0?1:-1;if(st[i]+sg>=rg[i][0]&&st[i]+sg<=rg[i][1]){st[i]+=sg;d-=sg}}
  return st;
}
/* 보직·수비 위치. 투수는 체력·회복력, 타자는 주루·수비로 정한다 */
const SLOT_NAME={SP:'선발',MR:'계투',CL:'마무리',C:'포수',CI:'1루/3루',MI:'2루/중견',OF:'외야'};
/* 팀 OVR: KBO 1군·MLB는 구단별 기준(teamBar), 그 밖의 리그는 리그 평균(REQ)에 팀 전력(-4 ~ +4)을 더한다. 고교는 45로 고정 */
function teamOvr(){
  if(P.lv==='HS')return 45;
  const t=teamProfile(P.team);
  if(t&&(P.lv==='KBO1'||P.lv==='MLB'))return Math.round(teamBar(t));
  return Math.round((REQ[P.lv]||55)+((P.tstr==null?.5:P.tstr)-.5)*8);
}
/* 투수: 체력이 팀 OVR 이상이면 선발, 아니면 회복력이 팀 OVR 이상일 때 마무리(매일 대기), 둘 다 낮으면 계투
   타자: 주루·수비를 팀 OVR과 비교해 2루/중견(둘 다 높음) · 외야(주루만) · 포수(수비만) · 1루/3루(둘 다 낮음) */
function slotOf(kind,st,bar){
  if(bar==null)bar=45;
  if(kind==='P')return st[3]>=bar?'SP':st[4]>=bar?'CL':'MR';
  const fast=st[3]>=bar,good=st[4]>=bar;
  return fast&&good?'MI':fast?'OF':good?'C':'CI';
}
/* 시즌마다 지금 팀 OVR 기준으로 보직·수비 위치를 다시 정한다 */
function updateSlot(){
  if(!P.slot||P.lv==='MIL')return '';
  const ns=slotOf(P.pitcher?'P':'H',P.st,teamOvr());
  if(ns===P.slot)return '';
  const msg=`${P.pitcher?'보직':'수비 위치'} 변경: ${SLOT_NAME[P.slot]} → ${SLOT_NAME[ns]}`;
  P.slot=ns;L(msg);return msg;
}
function rollStats(kind,role){
  const pitcher=kind==='P';
  const labels=pitcher?['구속','제구','구위','체력','회복력']:['컨택','파워','선구안','주루','수비'];
  const st=labels.map(()=>RI(34,50));
  /* 투수 유형은 고정 능력치 (합계 225 = OVR 45) */
  if(STAT_RANGE[role])return {labels,st:rollRange(STAT_RANGE[role]),pot:Math.round(C(58+Math.abs(G())*16+R(0,6),58,97))};
  if(role==='CL'){st[0]+=5;st[2]+=7;st[1]-=3;st[3]-=5}
  if(role==='MR'){st[0]+=2;st[2]+=3;st[3]-=1}
  if(role==='SP'){st[1]+=6;st[3]+=6;st[2]-=1}
  if(role==='OF'){st[3]+=5;st[4]+=1;st[0]+=3}
  if(role==='IF'){st[4]+=5;st[1]+=3}
  if(role==='DH'){st[1]+=7;st[0]+=3;st[4]-=8;st[3]-=4}
  const pot=Math.round(C(58+Math.abs(G())*16+R(0,6),58,97));
  return {labels,st:st.map(v=>C(v,20,70)),pot};
}

let CR={};

/* 잠재력 등급 확률: 쉬움 S>A>B · 보통 A>B>S · 어려움 B>A>S */
const DIFF_GRADE=[{S:.5,A:.35,B:.15},{A:.5,B:.3,S:.2},{B:.55,A:.3,S:.15}];
function rollPot(diff){
  const w=DIFF_GRADE[diff==null?1:diff];let x=Math.random(),g='B';
  for(const k of Object.keys(w)){if((x-=w[k])<0){g=k;break}}
  const floor={S:90,A:80,B:70}[g];
  return {g,pot:Math.round(C(floor+Math.abs(G())*5+R(0,2),floor,99))};
}
/* 부상 단계
   경미한 부상(minor): 약 6개월 이탈 → 시즌 절반 결장, 능력치 소폭 하락
   부상(major): 1~2년 이탈 → 이번 시즌 전체 + 다음 시즌까지 결장할 수 있음, 능력치·잠재력 하락
   심각한 부상(severe): 선수 생명이 끝나 시즌 후 은퇴
   시즌 부상 확률 (난이도별)
   쉬움: 약 2%, 경미한 부상만
   보통: 약 8% (31세부터 +5%p), 경미 80% · 부상 18% · 심각 2%
   어려움: 실제 MLB의 장기 부상자 명단(60일 IL) 수준. 투수 약 18%·타자 약 12%, 30세부터 해마다 +1%p
           경미 72% · 부상 25%(투수 28%) · 심각 3% */
function injuryBase(){
  const d=P.diff==null?1:P.diff;
  if(d===0)return .02;
  if(d===1)return .08+(P.age>31?.05:0);
  return (P.pitcher?.18:.12)+Math.max(0,P.age-30)*.01;
}
function injurySeverity(){
  const d=P.diff==null?1:P.diff,r=Math.random();
  if(d===0)return 'minor';
  if(d===1)return r<.8?'minor':r<.98?'major':'severe';
  const maj=P.pitcher?.28:.25;
  return r<.97-maj?'minor':r<.97?'major':'severe';
}

  if(kind==='P'){
    const K='#17100a',B='#9a6330',Lc='#bd8247',D='#74451e';
    const u=[.62,-.78],v=[.78,.62],base=[13,17.5];
    const shapes=[];
    shapes.push({a:[16,25],b:[25,20],r:3,c:[Lc,B,D]});                          /* 엄지 */
    [[-1.5,12],[-.5,14],[.5,13],[1.5,10.5]].forEach(([k,len])=>{
      const s0=[base[0]+v[0]*k*4.9,base[1]+v[1]*k*4.9];
      shapes.push({a:s0,b:[s0[0]+u[0]*len,s0[1]+u[1]*len],r:2.6,c:[Lc,B,D]});     /* 손가락 */
    });
    shapes.push({a:[11,21],b:[18,22.5],r:7.6,c:[Lc,B,D]});                       /* 손바닥 */
    shapes.push({a:[7,26.5],b:[15,28.5],r:3,c:['#7a4d26','#5e3a17','#4a2c10']}); /* 손목 스트랩 */
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){
      const px=x+.5,py=y+.5;
      shapes.forEach(sh=>{
        const dx=sh.b[0]-sh.a[0],dy=sh.b[1]-sh.a[1],L2=dx*dx+dy*dy;
        let t=((px-sh.a[0])*dx+(py-sh.a[1])*dy)/L2;t=Math.max(0,Math.min(1,t));
        const cx=sh.a[0]+t*dx,cy=sh.a[1]+t*dy,d=Math.hypot(px-cx,py-cy);
        if(d>sh.r)return;
        if(d>sh.r-1){put(x,y,K);return}
        const side=((px-cx)*dy-(py-cy)*dx)/Math.sqrt(L2),w=side/sh.r;
        put(x,y,w<-.35?sh.c[0]:w>.35?sh.c[2]:sh.c[1]);
      });
    }
    put(15,18,K);put(16,19,K);
  }else{
    const K='#3a210c',base='#e1b073',lt='#f2d49b',dk='#b97f3c';
    const x0=4.5,y0=27.5,x1=26,y1=6,dx=x1-x0,dy=y1-y0,L2=dx*dx+dy*dy;
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){
      const px=x+.5,py=y+.5;
      let t=((px-x0)*dx+(py-y0)*dy)/L2;t=Math.max(0,Math.min(1,t));
      const cx=x0+t*dx,cy=y0+t*dy,d=Math.hypot(px-cx,py-cy);
      let r=t<.5?1.5+t*.6:t<.8?1.8+(t-.5)*5.4:3.4+(t-.8)*1.2;
      if(t===0)r=2.4;                                         /* 손잡이 끝 knob */
      if(d>r+1.1)continue;
      if(d>r){put(x,y,K);continue}
      const side=((px-cx)*dy-(py-cy)*dx)/Math.sqrt(L2); /* 부호: 방향의 한쪽 */
      const u=side/r;
      put(x,y,u<-.35?dk:u>.35?lt:base);
    }
  }
  let L='';
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(grid[y][x])L+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${grid[y][x]}"/>`;
  return `<svg class="pixel-role-icon" viewBox="0 0 32 32" width="124" height="124" shape-rendering="crispEdges" aria-hidden="true" style="display:block;margin:0 auto;image-rendering:pixelated">${L}</svg>`;
}

function commitPrep(){
  if(!PREP_SEL.length)return;
  PREP_OPEN=false;
  const trains=PREP_SEL.filter(i=>i!==6),multi=trains.length,rest=PREP_SEL.includes(6);
  const co=coachAdvice(),followed=[];
  P.restFlag=rest&&!trains.length||rest;
  if(!trains.length){mental(RI(4,7))}
  else{
    const boost=multi>2?RI(1,3):multi>1?RI(2,4):RI(2,5);
    trains.forEach(i=>{
      if(i<5){
        const extra=co.foci.includes(i)?2:0;
        if(extra)followed.push(P.labels[i]);
        bump(i,boost+extra);
      }else if(i===5)mental(RI(3,7));
    });
    if(rest)mental(2);
  }
  if(followed.length)L(`코치의 계획: ${followed.join('·')} 훈련을 따라 성장이 더 빨랐다.`);

  P.mod={inj:0,perf:0,growth:0};
  P.planPicks=[];
  P.eventNote='';
  P.seasNews=[];
  grow();
  const ne=natEvent();if(ne)return runEvent(ne);

    const c=EV.filter(e=>e.w());
    if(c.length){
      const bad=c.filter(e=>e.bad),good=c.filter(e=>!e.bad);
      const pool=bad.length&&(!good.length||Math.random()<.48)?bad:(good.length?good:c);
      return runEvent(pick(pool));
    }

}

    if(a<=18)d=R(1.5,5)*c;else if(a<=21)d=R(1,4)*c;else if(a<=26)d=R(0,2.5)*c;else if(a<=30)d=R(-1,1);else if(a<=34)d=R(-2.6,.2);else d=R(-3.8,-.8);
    return C(Math.round((s+d)*10)/10,15,99)});
  const q=k=>(P.eq&&P.eq[k])||0,add=(i,v)=>{if(v)P.st[i]=C(Math.round((P.st[i]+v)*10)/10,15,99)};
  add(0,.3*q('weapon'));add(P.pitcher?1:4,.3*q('glove'));add(3,.3*q('spike'));
  if(q('gear'))for(let i=0;i<5;i++)add(i,.1*q('gear'));
  if(q('recov'))mental(2*q('recov'));
}

function injure(sev){
  if(sev==='surg')sev='major';
  if(P.diff===0)sev='minor'; /* 쉬움: 큰 부상 없음 */
  P.injured=sev;
  const core=P.pitcher?[0,2]:[1,3];
  if(sev==='minor'){bump(pick(core),-RI(1,2));if(Math.random()<.5)bump(RI(0,4),-1)}
  if(sev==='major'){
    bump(core[0],-RI(2,4));bump(core[1],-RI(2,4));bump(RI(0,4),-RI(1,2));
    P.pot=Math.max(50,(P.pot||70)-RI(1,3)); /* 후유증: 잠재력 하락 */
    P.outLeft=RI(0,1); /* 이번 시즌 + 0~1시즌 더 결장 = 1~2년 */
  }
  if(sev==='severe'){bump(core[0],-RI(4,6));bump(core[1],-RI(4,6))}
}

function choiceOf(c){return typeof c[1]==='function'?{l:c[0],d:'',fn:c[1]}:{l:c[0],d:c[1],fn:c[2]}}
function bannerHtml(){return P.playBanner&&P.playBanner.text?`<p class="form-line ${P.playBanner.ok?'ok':'bad'}">${P.playBanner.text}</p>`:''}
function setBanner(text,ok){
  const line=String(text||'').replace(/\s+/g,' ').trim();
  if(!line)return;
  P.playBanner={ok:!!ok,text:line.length>48?line.slice(0,46)+'…':line};
}
function bannerOk(line){
  if(/위험 감소/.test(line))return true;
  return !/탈락|불참|출전하지|오르지|기약|중하위|하락|실패|꼬였|부진|아쉽|결장|접었|부상|통증/.test(line);
}
let SEAS_MODE='',SEAS_EV=null,SEAS_RES=null;
function runEvent(e){
  SEAS_MODE='event';SEAS_EV=e;PREP_OPEN=false;HUBTAB='main';hub();
}
function seasonShell(title,body,cls=''){
  return `<div class="backdrop prep-backdrop b2"><div class="win prep-win ${cls}" onclick="event.stopPropagation()"><div class="wbar"><span>${title}</span></div><div class="wbody">${body}</div></div></div>`;
}
function seasonOverlay(){
  if(SEAS_MODE==='event'&&SEAS_EV){
    const e=SEAS_EV;
    const opts=e.c.map(c=>{
      const ch=choiceOf(c);
      return B(`<b>${ch.l}</b>${ch.d?`<span class="sub">${ch.d}</span>`:''}`,()=>{const r=ch.fn();L(`${e.t} — ${r}`);P.eventNote=r;setBanner(r,bannerOk(r));if(e.nat&&NAT_Q.length)return runEvent(NAT_Q.shift());beginPlan()},'choice');
    }).join('');
    return seasonShell(e.t,`${bannerHtml()}<p class="sub">${e.nat?'국제대회':'시즌 이벤트'}</p><p>${e.x}</p><div class="opts">${opts}</div>`);
  }
  if(SEAS_MODE==='hs')return hsOverlay();
  if(SEAS_MODE==='plan'){
    const st=PLAN_STEP,step=PLAN[st];
    const pips=PLAN.map((q,i)=>`<span class="${i<st?'done':i===st?'now':''}">${q.tag}</span>`).join('');
    const nw=P.seasNews&&P.seasNews[st]?`<div class="season-news"><b>${P.seasNews[st].tag}</b> · ${P.seasNews[st].h}</div>`:'';
    const note=st===0&&P.eventNote?`<p class="sub">직전 선택 — ${P.eventNote}</p>`:'';
    const opts=step.ch.map((c,i)=>B(`<b>${c.l}</b><span class="sub">${c.d}</span>`,()=>choosePlan(i),'choice')).join('');
    return seasonShell(step.title,`${bannerHtml()}<p class="sub">${P.y}년 · ${lvLabel()} · ${P.team} · 시즌 플랜 ${st+1}/3</p><div class="plan-steps">${pips}</div>${nw}${note}<p>${step.text}</p><div class="opts">${opts}</div>`);
  }
  if(SEAS_MODE==='result')return resultOverlay();
  if(SEAS_MODE==='offer')return offerOverlay();
  return '';
}

function teamProfile(name){return TEAMS.find(t=>t.name===name)||null}
function teamRank(t){return (t.org==='MLB'?1000:0)+t.win*.5+t.fame*.25+t.pay*.25}
function teamBar(t){return (t.org==='MLB'?62:46)+t.win*.18+t.fame*.10+t.pay*.08}
function marketValue(){return ovr()+Math.min(P.fame||0,12)*1.1+(P.lastIdx||0)*4}
function teamBlurb(t){
  const w=t.win>=75?'강팀':t.win>=55?'중위권':'약팀';
  const f=t.fame>=75?'명문':t.fame>=50?'인기':'무명';
  const p=t.pay>=75?'고액 연봉':t.pay>=50?'보통 연봉':'박봉';
  return `${w} · ${f} · ${p}`;
}
function payLabel(deal,org){
  const w=won(deal);
  return org==='MLB'&&RULE.cur!=='USD'?`${w} · ${usdText(deal)}`:w;
}
function currentPay(){
  const cap=yearlyPay(ovr(),P.lv==='MLB');
  if(P.deal)return Math.min(P.deal,cap);
  return cap;
}
function offerCeiling(o,org,minor){return yearlyPay(o,org==='MLB'&&!minor)}
function offerDeal(o,org,teamPay,minor){
  const cap=offerCeiling(o,org,minor);
  const scale=.8+((teamPay||50)/100)*.2;
  return Math.max(.05,Math.round(Math.min(cap,cap*scale)*10)/10);
}
/* 구단 기준(teamBar)에 가까워야 연락이 온다. KBO는 기준 -8까지, MLB는 OVR 65 이상이면서 기준 -10까지(75 미만은 마이너 계약) */
function teamFits(t,o){
  if(t.org==='KBO')return o>=teamBar(t)-8;
  return o>=65&&o>=teamBar(t)-10;
}
function offerYears(t,val){
  if(val>=teamBar(t)+8)return t.pay>=70?5:4;
  if(val>=teamBar(t))return 3;
  return 1;
}
function otherTeams(o){
  /* 이적 후보: 구단 기준(teamBar)이 내 OVR과 가장 가까운 구단. MLB 구단은 OVR 75(빅리그 구단 최저 기준) 이상일 때만 */
  let fit=TEAMS.filter(t=>t.name!==P.team&&teamFits(t,o)&&(t.org==='KBO'||o>=75)).sort((a,b)=>Math.abs(teamBar(a)-o)-Math.abs(teamBar(b)-o));
  if(fit.length<2){
    const org=o>=75?'MLB':'KBO';
    const extra=TEAMS.filter(t=>t.org===org&&t.name!==P.team&&!fit.includes(t)).sort((a,b)=>Math.abs(teamBar(a)-o)-Math.abs(teamBar(b)-o));
    fit=fit.concat(extra);
  }
  return fit.slice(0,2);
}
function buildOffers(){
  const o=ovr(),cur=teamProfile(P.team),pay=currentPay();
  const org=P.org==='MLB'?'MLB':'KBO';
  const tstr=cur?cur.win/100:(P.tstr||.5);
  const left=Math.max(1,(P.contract||1)-1);
  const minorStay=org==='MLB'&&P.lv!=='MLB';
  const stay={kind:'stay',title:'계약을 유지한다',sub:`${P.team} · ${payLabel(pay,org)} · ${left}년`,team:P.team,org,deal:pay,yrs:left,tstr,minor:minorStay};
  const idx=P.lastIdx||0,pct=idx>=1.5?.28:idx>=.6?.16:idx>=0?.08:0;
  const ceiling=offerCeiling(o,org,minorStay);
  const toward=pct>=.16?ceiling:pct>0?Math.round((pay+ceiling)/2*100)/100:pay;
  const raised=Math.round(Math.min(ceiling,Math.max(pay,toward))*100)/100;
  const raiseYrs=Math.max(left,pct>=.16?3:2);
  const raise=pct&&raised>pay+.05?{kind:'raise',title:'연봉 인상을 요구한다',sub:`${P.team} · ${payLabel(pay,org)} → ${payLabel(raised,org)} · ${raiseYrs}년`,team:P.team,org,deal:raised,yrs:raiseYrs,tstr,minor:minorStay}
    :{kind:'raise',refused:true,title:'연봉 인상을 요구한다',sub:pay+0.05>=ceiling?'이미 이 실력의 연봉 상한이다.':'구단이 이번 시즌 성적을 이유로 거절한다',team:P.team,org,deal:pay,yrs:left,tstr,minor:minorStay};
  const moves=otherTeams(o).map(t=>{
    const minor=t.org==='MLB'&&o<75;
    const deal=offerDeal(o,t.org,t.pay,minor);
    return {kind:'move',title:t.name,sub:`${t.org}${minor?' 마이너':''} · ${teamBlurb(t)} · ${payLabel(deal,t.org)} · ${offerYears(t,o)}년`,team:t.name,org:t.org,deal,yrs:offerYears(t,o),tstr:t.win/100,minor};
  });
  return [stay,raise,...moves];
}

function takeOffer(i){

  const note=x.refused?'인상은 무산되고 잔류했다.':x.kind==='raise'?'연봉 인상에 합의했다.':x.kind==='stay'?'남은 계약을 이어 간다.':`${x.team}과 계약했다.`;
  L(`계약 — ${note} ${x.team} · ${payLabel(x.deal,x.org)}`);
  P.offers=null;SEAS_MODE='';P.news.push(note+(back?' 한국으로 돌아왔다.':''));

function pickClub(org,val){
  const fit=TEAMS.filter(t=>t.org===org&&val>=teamBar(t)).sort((a,b)=>teamRank(b)-teamRank(a));
  if(fit.length)return fit[0];
  return TEAMS.filter(t=>t.org===org).slice().sort((a,b)=>teamBar(a)-teamBar(b))[0];
}

function tradeNotice(){
  const pool=KBO.filter(t=>t!==P.team),team=pick(pool);
  show(()=>hud()+panel('갑작스러운 트레이드 통보',`<p>구단이 <b>${team}</b>과의 트레이드에 합의했다. KBO 선수에게는 원칙적으로 트레이드 팀을 선택할 권리가 없다.</p>`
    +B('트레이드 거부권을 행사한다',()=>completeTrade(team,true),'alt')
    +B('트레이드 거부권을 행사하지 않는다',()=>completeTrade(team,false))));
}
function afterSeason(){
  if(P.retire)return ending();
  if(P.lv==='HS'){if(P.grade<3){P.grade++;return hub()}return careerChoice()}
  if(P.lv==='UNI'){if(P.uniYear<RULE.uniYears){P.uniYear++;return hub()}return draftIntro('UNI')}
  if(P.grace>0){P.grace--;if(P.grace>0||P.lv==='MIL')return hub();return draftIntro('ABR')}
  ensureFaState();
  if(P.org==='KBO'){
    if(P.faEligible)return faScreen(false);
    if(Math.random()<.08)return tradeNotice();
    return hub();
  }
  if(P.org==='MLB'){
    if((P.contract||1)<=1)return faScreen(true);
    P.contract--;return hub();
  }
  hub();
}
function nextSeason(first){
  P.news=[];
  P.mod=null;P.planPicks=[];P.eventNote='';P.seasNews=[];P.hsRun=null;
  if(!first){P.age++;P.y++}
  if(P.outLeft>0)P.news.push('재활 시즌: 작년 부상으로 이번 시즌도 뛸 수 없다.');
  if(isPro(P.lv)&&(P.age>=42||(P.age>=30&&ovr()<46))){P.retire=true;return ending()}
  if(RULE.mil!=='none'&&isPro(P.lv)&&P.mil==='none'&&P.age>=27)return militaryChoice(P.age===27&&!P.deferred);
  proceed();
}
function proceed(){PREP_SEL=[];movement();P.news.forEach(n=>L(n));trainScreen()}
function movement(){
  const o=ovr()+R(-3,3);
  if(P.lv==='KBO2'&&o>=REQ.KBO1-4){P.lv='KBO1';P.news.push('1군 콜업! 드디어 1군 엔트리에 이름이 올랐다.');if(!P.ach['KBO 1군 데뷔']){A('KBO 1군 데뷔')}}
  else if(P.lv==='KBO1'&&o<REQ.KBO1-10){P.lv='KBO2';P.news.push('2군행 통보. 퓨처스에서 다시 시작이다.')}
  else if(isMin(P.lv)&&!(P.lvYear>=P.y)){
    /* 마이너는 1년에 한 단계씩: A → AA → AAA → MLB */
    const nx={A:'AA',AA:'AAA',AAA:'MLB'}[P.lv];
    if(o>=REQ[nx]-8){
      P.lv=nx;P.lvYear=P.y;
      if(nx==='MLB'){P.news.push('메이저리그 콜업!! 꿈에 그리던 빅리그 로스터.');if(!P.ach['MLB 빅리그 데뷔'])A('MLB 빅리그 데뷔')}
      else P.news.push(nx==='AAA'?'AAA 승격! 빅리그가 눈앞이다.':'AA 승격!');
    }
  }
  else if(P.lv==='MLB'&&o<REQ.MLB-10){P.lv='AAA';P.lvYear=P.y;P.news.push('AAA로 내려갔다. 다시 올라갈 수 있을까.')}
}
function militaryChoice(canDefer){
  const ok=RULE.mil==='kr'&&P.org==='KBO'&&ovr()>=56;
  const shot=[2030,2034,2038,2042,2046,2050].includes(P.y)?'올해는 아시안게임 해다. 금메달이면 예술·체육요원이다.':'아시안게임 금메달, 또는 올림픽 동메달 이상이면 예술·체육요원이다.';
  show(()=>hud()+panel('병역의 의무',`<p>만 ${P.age}세. 병역을 마치지 않았다. ${P.org==='MLB'?'해외 진출 중이라도 국외여행 허가의 한계가 다가온다.':'더 미루기는 어렵다.'}</p><p class="sub">상무(국군체육부대)는 KBO 선수만 지원할 수 있고 경쟁이 치열합니다. 현역은 야구를 완전히 쉬어야 합니다. ${shot}</p>`
   +(ok?B('상무(국군체육부대) 지원',()=>{if(Math.random()<C(.45+(ovr()-56)*.02,.4,.9))enlist('상무');else show(()=>panel('상무 탈락',`<p>아쉽게 상무 선발에서 떨어졌다. 현역으로 입대한다.</p>${B('입대',()=>enlist('현역'))}`))}):'')
   +B('현역 입대',()=>enlist('현역'))
   +(canDefer?B('1년 미루고 국가대표 기회를 노린다',()=>{P.deferred=true;proceed()},'alt'):'')));
}
function enlist(type){P.milType=type;P.milLeft=RULE.milYears;P.prevLv=P.lv;P.lv='MIL';P.news=[`${type} 입대. ${RULE.milYears}년의 시간이 시작된다.`];L(P.news[0]);trainScreen()}

/* ============ 진로 / 드래프트 ============ */
const draftScore=from=>ovr()+(P.pot-75)*.1+(from==='UNI'?-1:0);
function careerChoice(){
  const sc=draftScore('HS'),exp=Math.round(130-(sc-46)*10);
  const expPk=Math.ceil(C(exp,1,110)*RULE.draftPicks/110);
  const txt=exp>110?'지명 가능성이 낮다':`${C(Math.ceil(expPk/RULE.draftTeams),1,40)}라운드 전후`;
  if(!P.mlbOffers)P.mlbOffers=RULE.mlbOffers&&sc>=53?mlbAmateurOffers(sc):[];
  const mo=P.mlbOffers;
  const mlbBtns=mo.map(x=>B(`[MLB] ${x.team} · 계약금 ${won(x.bonus*EOK_PER_M)} ($${f1(x.bonus)}M) · ${tier(x.tstr)}`,()=>signMLBDirect(x),'red')).join('');
  const ret=RULE.returnRule==='grace'?'KBO를 거치지 않고 해외로 나가면, 나중에 KBO로 돌아올 때 2년 유예 기간이 있습니다. ':RULE.returnRule==='draft'?'KBO를 거치지 않고 해외로 나가면, 나중에 돌아올 때 KBO 신인드래프트를 거쳐야 합니다. ':'';
  const note=(mo.length?'MLB는 싱글A부터 1년에 한 단계씩(AA → AAA → 메이저) 올라갑니다. '+ret:'')
    +(!RULE.domestic?'MLB 드래프트로 지명되면 싱글A부터 1년에 한 단계씩 올라갑니다.':RULE.homeDraft?'KBO 드래프트에서는 고향 연고 구단이 지명합니다. 연고 구단이 없는 지역은 무작위 구단입니다.':'');
  show(()=>hud()+panel('졸업 후 진로',`<p>3년간의 고교 야구가 끝났다. 스카우트 보고서의 예상: <b>${txt}</b></p>`
   +(mo.length?`<p>드래프트 전에 메이저리그 구단의 계약 제의가 도착했다. 드래프트에 참가하면 이 제의는 사라진다.</p>${mlbBtns}`:'')
   +B(RULE.domestic?'KBO 신인드래프트에 도전':'MLB 신인드래프트에 도전',()=>draftIntro('HS'))+B(RULE.uniYears===2?'2년제 대학에 진학한다':'대학에 진학한다',goUni,'alt')
   +(note?`<p class="sub">${note}</p>`:'')));
}
function mlbAmateurOffers(sc){
  const n=sc>=58?2:1,pool=shuffle(TEAMS.filter(t=>t.org==='MLB'));
  return pool.slice(0,n).map(t=>({team:t.name,tstr:t.win/100,bonus:Math.round(C((sc-50)*.3+G()*.15,.1,5)*100)/100}));
}
function goUni(){P.mlbOffers=null;P.lv='UNI';P.uniYear=1;P.team=pick(UNIS);L(`2년제 대학 진학 — ${P.team}`);hub()}
function signMLBDirect(x){
  P.mlbOffers=null;
  P.org='MLB';P.team=x.team;P.lv='A';P.lvYear=P.y+1;P.contract=6;P.deal=null;P.tstr=x.tstr;P.money+=x.bonus*EOK_PER_M;P.amateurMLB=true;L('MLB 아마추어 계약 — '+x.team);
  show(()=>panel('MLB 직행!',`<p><b>${x.team}</b>와 계약. 계약금 ${won(x.bonus*EOK_PER_M)} · $${f1(x.bonus)}M.</p><p>한국에서 고교를 졸업하고 곧장 미국으로 건너왔다. 언어도, 음식도 낯설다.</p><p class="sub">싱글A에서 시작해 1년에 한 단계씩 올라간다. 순조롭다면 4년차에 메이저리그 데뷔.</p>${B('싱글A 합류',hub)}`));
}
/* 고향 연고 구단: 서울은 LG·두산·키움 중 1/3, 연고 구단이 없는 지역은 무작위 */
function homeTeam(){const f=RULE.homeDraft&&FAV[P.region];return f&&f.length?pick(f):pick(KBO)}
/* KBO를 거치지 않고 해외로 나갔던 선수는 복귀 전 2년 유예 */
function graceStart(mode){
  P.org='';P.contract=0;P.deal=null;P.grace=2;P.amateurMLB=false;
  if(mode==='MIL'){
    P.team='국군';P.milType='현역';P.milLeft=2;P.prevLv='IND';P.lv='MIL';L('KBO 복귀 유예 — 현역 입대');
    return show(()=>panel('현역 입대',`<p>유예 기간 2년을 군 복무로 채운다. 전역하면 독립야구단 신분으로 KBO 신인드래프트에 나간다.</p>${B('입대',hub)}`));
  }
  P.lv='IND';P.team=pick(IND_TEAMS);L('KBO 복귀 유예 — 독립야구단 '+P.team);
  show(()=>panel('독립야구단 입단',`<p><b>${P.team}</b> 유니폼을 입었다. 2년 동안 프로 구단과 계약할 수 없다.</p><p>유예 기간이 끝나면 KBO 신인드래프트에 나간다.</p>${B('시즌 준비',hub)}`));
}
function graceChoice(){
  show(()=>hud()+panel('KBO 복귀 — 2년 유예',`<p>KBO 구단과 계약하지 않고 해외로 나갔던 선수는 돌아와도 2년간 국내 프로 구단에서 뛸 수 없다. 유예 기간이 끝나면 신인드래프트를 거친다.</p>`
   +(P.mil==='none'?B('현역 입대 (병역을 마친다)',()=>graceStart('MIL')):'')
   +B('독립야구단에서 뛴다',()=>graceStart('IND'),'alt')
   +B('← 다른 제의 보기',()=>faScreen(true),'alt')));
}
function draftIntro(from){
  P.mlbOffers=null;
  show(()=>panel('KBO 신인 드래프트 D-Day',`<p>서울의 한 호텔 컨벤션홀. 구단 관계자들이 둘러앉은 가운데 지명이 시작된다.</p><p>당신의 이름은 불릴까?</p>${B('지명 순간을 지켜본다',()=>draftResult(from))}`));
}
function draftResult(from){
  const sc=draftScore(from)+G()*.6;
  const raw=Math.round(C(130-(sc-46)*10+G()*6,1,140));
  if(raw>110){
    return show(()=>panel('지명 실패',`<p>${RULE.draftPicks}명의 이름이 불렸지만 그 안에 <b>${P.name}</b>은 없었다.</p><p>아직 끝난 게 아니다.</p>`
      +(RULE.domestic?B('육성선수로 입단한다',()=>signKBO(homeTeam(),999,12,.2*RULE.bonusMul,from),'alt')
        :B('드래프트 외 자유계약으로 입단한다',()=>mlbDraftSign(pick(MLB),0,0,.05*EOK_PER_M,from),'alt'))
      +(from==='HS'?B('대학에 진학한다',goUni):'')
      +(from!=='HS'?B('은퇴하고 새 길을 찾는다',()=>{P.retire=true;ending()},'red'):'')));
  }
  const pk=Math.max(1,Math.ceil(raw*RULE.draftPicks/110)),round=Math.ceil(pk/RULE.draftTeams);
  if(!RULE.domestic){
    const bonus=EOK_PER_M*(pk<=30?9.5-(pk-1)*.25:pk<=100?1.2:pk<=300?.25:.05);
    return mlbDraftSign(pick(MLB),pk,round,bonus,from);
  }
  const kr=Math.ceil(raw/10),team=RULE.homeDraft?homeTeam():P.draftOrder[(pk-1)%P.draftOrder.length];
  const bonus=(kr===1?5.5-.35*(raw-1):kr===2?1:kr<=4?.6:.25)*RULE.bonusMul;
  signKBO(team,pk,round,bonus,from,true,raw<=20);
}
/* 미국판: MLB 드래프트 → 싱글A부터 */
function mlbDraftSign(team,pk,round,bonus,from){
  const club=teamProfile(team)||{win:50};
  P.mlbOffers=null;P.org='MLB';P.team=team;P.lv=(from==='UNI'&&pk&&pk<=30)?'AA':'A';P.lvYear=P.y+1;P.contract=6;P.deal=null;P.tstr=club.win/100;P.money+=bonus;P.entryFrom=from;
  let extra='';
  if((FAV[P.region]||[]).includes(team)){fame(2);mental(4);extra=`<p style="color:var(--gold)">★ 고향 ${P.region}의 연고 구단이다. 어릴 적부터 응원하던 팀의 유니폼을 입게 됐다! (명성+2, 멘탈+4)</p>`}
  const head=pk?`${P.y+1} MLB 신인드래프트 ${round}라운드 (전체 ${pk}순위)`:'드래프트 외 자유계약';
  L(`${head} — ${team}`);
  show(()=>panel(head,`<p><b>${team}</b>이(가) 당신을 지명했다!</p><p>${bonus>0?`계약금 ${won(bonus)}. `:''}${P.lv==='AA'?'상위 지명 대졸이라 더블A에서 시작한다.':'싱글A에서 시작해 1년에 한 단계씩 올라간다.'}</p>${extra}${B('프로 데뷔 시즌으로',hub)}`));
}
function signKBO(team,pk,round,bonus,from,drafted,top){
  P.org='KBO';P.team=team;P.lv=(top==null?pk<=20:top)?'KBO1':'KBO2';P.entryFrom=from;P.grace=0;P.amateurMLB=false;P.kboRegDays=0;P.kboService=0;P.faEligible=false;P.faUsed=false;P.tstr=(teamProfile(team)||{win:50}).win/100;P.money+=bonus;
  if(P.lv==='KBO1')A('KBO 1군 데뷔');
  let extra='';
  if((FAV[P.region]||[]).includes(team)){fame(2);mental(4);extra=`<p style="color:var(--gold)">★ 고향 ${P.region}의 연고 구단이다. 어릴 적부터 응원하던 팀의 유니폼을 입게 됐다! (명성+2, 멘탈+4)</p>`}
  const head=drafted?`${P.y+1} KBO 신인드래프트 ${round}라운드 (전체 ${pk}순위)`:'육성선수 계약';
  L(`${head} — ${team}`);
  show(()=>panel(head,`<p><b>${team}</b>이(가) 당신을 지명했다!</p><p>${bonus>0?`계약금 ${won(bonus)}. `:''}${P.lv==='KBO1'?'상위 지명이라 1군 캠프부터 합류한다.':'일단 퓨처스(2군)에서 시작한다.'}</p>${extra}${B('프로 데뷔 시즌으로',hub)}`));
}

/* ============ 포스팅 / FA ============ */
function postingChoice(){
  show(()=>hud()+panel('포스팅 시스템',`<p>메이저리그 구단들이 당신을 주시하고 있다. 구단이 동의해야 포스팅이 가능하다.</p>`
   +B('포스팅을 신청한다',()=>{const ok=Math.random()<C(.5+P.fame*.03+(ovr()-66)*.01,.35,.9);
      if(!ok)return show(()=>panel('포스팅 무산',`<p>구단이 끝내 동의하지 않았다. “우리에겐 아직 네가 필요해.”</p>${B('시즌 준비',hub)}`));
      postingSign()},'red')
   +B('이번엔 잔류한다',hub,'alt')));

function mlbEntry(){const o=ovr();return o>=75?'MLB':o>=70?'AAA':o>=63?'AA':'A'}
function postingSign(){
  const o=ovr();
  const pool=TEAMS.filter(t=>t.org==='MLB'&&teamFits(t,o)).sort((a,b)=>teamRank(b)-teamRank(a));
  const club=pool[0]||pickClub('MLB',marketValue());
  const minor=o<75,yrs=offerYears(club,o),deal=offerDeal(o,'MLB',club.pay,minor);
  P.org='MLB';P.team=club.name;P.contract=yrs;P.deal=deal;P.tstr=club.win/100;P.lv=minor?(o>=70?'AAA':o>=63?'AA':'A'):'MLB';P.lvYear=P.y+1;L('포스팅으로 MLB 진출 — '+club.name);
  if(P.lv==='MLB'&&!P.ach['MLB 빅리그 데뷔'])A('MLB 빅리그 데뷔');
  show(()=>panel('MLB 진출!',`<p><b>${club.name}</b>과(와) 계약했다. 연 ${payLabel(deal,'MLB')} × ${yrs}년.</p><p>${P.lv==='MLB'?'메이저리그 개막 로스터에 이름이 올랐다.':'마이너 '+P.lv+'에서 빅리그 콜업을 노린다.'}</p>${B('미국 생활 시작',hub)}`));
}
function faScreen(fromMLB){
  ensureFaState();
  const o=ovr(),offers=[],allowMLB=fromMLB||P.kboService>=RULE.faAbroad;
  let kt=shuffle(TEAMS.filter(t=>t.org==='KBO'&&t.name!==P.team&&teamFits(t,o)));
  if(!kt.length)kt=TEAMS.filter(t=>t.org==='KBO'&&t.name!==P.team).sort((a,b)=>a.pay-b.pay);
  kt=kt.slice(0,2);
  if(!fromMLB&&teamProfile(P.team)&&teamProfile(P.team).org==='KBO')kt.unshift(teamProfile(P.team));
  const graced=fromMLB&&P.amateurMLB&&!P.kboYears&&RULE.returnRule!=='free';
  if(!graced)kt.slice(0,3).forEach(t=>offers.push({org:'KBO',team:t.name,tstr:t.win/100,yrs:offerYears(t,o),deal:offerDeal(o,'KBO',t.pay,false)}));
  if(allowMLB&&(o>=65||fromMLB)){
    let mlb=shuffle(TEAMS.filter(t=>t.org==='MLB'&&t.name!==P.team&&teamFits(t,Math.max(o,65))));
    if(!mlb.length)mlb=TEAMS.filter(t=>t.org==='MLB').sort((a,b)=>a.pay-b.pay);
    mlb.slice(0,fromMLB?3:2).forEach(t=>offers.push({org:'MLB',team:t.name,tstr:t.win/100,yrs:offerYears(t,o),deal:offerDeal(o,'MLB',t.pay,o<75),minor:o<75}));
    if(fromMLB&&teamProfile(P.team)){const cur=teamProfile(P.team);offers.push({org:'MLB',team:cur.name,tstr:cur.win/100,yrs:offerYears(cur,o),deal:offerDeal(o,'MLB',cur.pay,o<75),minor:o<75})}
  }
  const lab=x=>`${x.team} · ${x.org==='MLB'&&x.minor?'마이너 계약 · ':''}${payLabel(x.deal,x.org)}/년 × ${x.yrs}년 · ${tier(x.tstr)}`;
  show(()=>hud()+panel('FA 시장이 열렸다',`<p>${fromMLB?'메이저리그 계약이 끝났다. 새 팀을 찾거나, 유턴할 수도 있다.':'KBO FA 자격 취득! 선택이 인생을 바꾼다.'}</p>`
   +offers.map(x=>B((x.org==='MLB'?'[MLB] ':'[KBO] ')+lab(x),()=>pickOffer(x,fromMLB),x.org==='MLB'?'red':'')).join('')+(graced?(RULE.returnRule==='grace'?B('[KBO] 한국으로 돌아간다 (2년 유예 후 드래프트)',graceChoice,'alt'):B('[KBO] 고국으로 돌아간다 (신인드래프트 참가)',()=>{P.org='';P.contract=0;P.deal=null;P.amateurMLB=false;L('고국 복귀 — 신인드래프트 참가');draftIntro('ABR')},'alt')):'')+`<p class="sub">${!fromMLB&&P.kboService<RULE.faAbroad?'대졸 국내 FA는 7시즌부터 가능하지만 해외 FA 계약은 8시즌을 채워야 합니다. ':''}강팀일수록 우승 확률이 높지만 보수는 선택의 문제입니다.</p>`));
}
function pickOffer(x,fromMLB){
  const wasMLB=P.org==='MLB',wasKboFa=!fromMLB&&P.org==='KBO';
  P.team=x.team;P.org=x.org;P.contract=x.yrs;P.deal=x.deal;P.tstr=x.tstr;L(`${x.org} FA 계약 — ${x.team}`);
  if(wasKboFa){P.faUsed=true;P.faEligible=false}
  if(x.org==='MLB'){
    const o=ovr();
    P.lv=(x.minor||o<75)?(o>=70?'AAA':o>=63?'AA':'A'):'MLB';P.lvYear=P.y+1;
    if(P.lv==='MLB'&&!P.ach['MLB 빅리그 데뷔'])A('MLB 빅리그 데뷔');
  }else{
    P.lv=ovr()>=65?'KBO1':'KBO2';
    if(P.lv==='KBO1'&&!P.ach['KBO 1군 데뷔'])A('KBO 1군 데뷔');
  }
  show(()=>panel('계약 완료',`<p><b>${x.team}</b>와 ${x.yrs}년 계약.${wasMLB&&x.org==='KBO'?' 유턴을 택했다. 팬들은 뜨겁게 환영했다.':''}</p>${B('다음 시즌',hub)}`));
}

/* ============ 엔딩 ============ */
function score(){let s=0;for(const k in P.ach)s+=(PTS[k]||0)*P.ach[k];s+=P.kbo1Years*.3+P.mlbYears*.7+P.fame*.2;return Math.round(s)}
function gradeOf(s){return s>=90?['S','전설']:s>=60?['A','명예의 전당급']:s>=36?['B','리그 정상급 스타']:s>=18?['C','주전급 베테랑']:s>=8?['D','1군 생활을 한 선수']:['E','무명으로 남은 도전자']}
function titleOf(){
  const a=P.ach,h=k=>a[k]>0;
  const mlbBest=h('MLB MVP')||h('사이영상')||h('MLB MVP·사이영상급');
  if(h('월드시리즈 우승')&&mlbBest)return '월드시리즈를 품은 전설의 코리안 메이저리거';
  if(h('월드시리즈 우승'))return '월드시리즈 챔피언';
  if(h('올림픽 금메달'))return '올림픽 야구 금메달리스트';
  if(h('WBC 우승'))return 'WBC를 들어 올린 국가대표';
  if(mlbBest)return '메이저리그를 평정한 코리안 슈퍼스타';
  if(h('한국시리즈 우승')&&P.mlbYears>0)return '한국시리즈 우승 + 빅리그를 경험한 선수';
  if(h('KBO MVP'))return 'KBO 정규시즌 MVP';
  if(h('한국시리즈 우승'))return '한국시리즈 챔피언';
  if(P.mlbYears>=3)return '코리안 메이저리거';
  if(h('KBO 골든글러브'))return 'KBO 골든글러브 수상자';
  if(P.kbo1Years>=8)return 'KBO 베테랑';
  if(P.kbo1Years>0||P.mlbYears>0)return '프로 1군 선수';
  return '프로의 문턱에서 멈춘 도전자';
}
function ending(){
  P.done=true;try{localStorage.removeItem(SK('b2ws_save'))}catch(e){}
  const s=score(),[g,gd]=gradeOf(s),ti=titleOf();
  const role=roleLabel();
  try{const l=JSON.parse(localStorage.getItem(SK('b2ws_hof'))||'[]');l.push({name:P.name,role,grade:g,score:s,title:ti,kbo:P.kbo1Years,mlb:P.mlbYears,card:cardHtml(P,{ovr:ovr(),pot:potG()})});l.sort((a,b)=>b.score-a.score);localStorage.setItem(SK('b2ws_hof'),JSON.stringify(l.slice(0,10)))}catch(e){}
  const ach=Object.keys(P.ach).map(k=>`<span class="tag g">${k}${P.ach[k]>1?' ×'+P.ach[k]:''}</span>`).join('')||'<span class="sub">(없음)</span>';
  const epi=(P.injRetire?'큰 부상으로 선수 생활을 일찍 마감했다. ':'')+(g==='S'?'은퇴식 날, 구단은 당신의 등번호를 영구결번으로 지정했다. 소년들은 오늘도 당신의 투구/스윙 영상을 돌려본다.':g==='A'?'은퇴 후 몇 년이 지나 명예의 전당 입성 소식이 전해졌다.':g==='B'?'팬들은 당신이 뛰던 시절을 “그때가 좋았지”하고 기억한다.':g==='C'?'화려하진 않았지만 팀의 한 시대를 묵묵히 받쳐준 선수로 남았다.':g==='D'?'1군 무대를 밟았다는 사실, 그것만으로도 대단한 일이다.':'벤치에서 시작했고, 끝내 벤치를 떠나지 못했다. 그래도 야구는 즐거웠다.');
  const share=`⚾ 「${GAME_NAME}」 ${P.name}(${role}) — ${g}등급 ${gd}\n${ti}\nKBO ${P.kbo1Years}시즌 · MLB ${P.mlbYears}시즌 · 통산 ${won(P.money)}\n나도 해보기 👉 `;
  show(()=>`<div class="panel" style="text-align:center"><p class="sub">${P.y}년, ${P.age}세 — 은퇴</p><div class="big">${g}</div><h2 style="font-size:22px">${ti}</h2><p>${gd} · 레전드 점수 ${s}점</p><p>${epi}</p></div>`
   +panel('커리어 요약',`<p>${P.name} · ${role} · ${P.region} 출신</p><p>KBO 1군 ${P.kbo1Years}시즌 (프로 ${P.kboYears}시즌) · MLB ${P.mlbYears}시즌</p><p>${RULE.mil==='none'?'':`병역: ${P.mil==='exempt'?'특례 면제':P.mil==='done'?'군 복무 완료':'미필'} · `}통산 수입 ${won(P.money)}</p><p>${ach}</p>`)
   +panel('시즌별 기록',`<div class="scroll"><table><tr><th>연도</th><th>나이</th><th>소속</th><th>리그</th><th>성적</th><th>기록</th></tr>${P.hist.map(h=>`<tr><td>${h.y}</td><td>${h.age}</td><td>${h.team}</td><td>${h.lv}</td><td>${h.line}</td><td>${h.tags.join(', ')}</td></tr>`).join('')}</table></div>`)
   +`<div>${B('결과 공유(복사)',()=>{const txt=TR(share)+location.href;if(navigator.share){navigator.share({text:TR(share),url:location.href}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(txt).then(()=>alert('복사했어요!'),()=>prompt('복사해서 공유하세요',txt))}else prompt('복사해서 공유하세요',txt)})}${B('Hall of Fame',hofScreen)}${B('메인 메뉴',menu,'alt')}</div>`);
}
title();
</script>
