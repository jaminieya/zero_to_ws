<link rel="preconnect" href="https://cdn.jsdelivr.net">

<style>
:root{--paper:#f3e9c6;--ink:#17140d;--gold:#f6c21b;--red:#d8452f;--grass:#2b7a3d;--navy:#0f2a1a}
*{box-sizing:border-box}
html,body{margin:0;background:#050d08}
body{color:var(--paper);font-family:'Galmuri11','Galmuri9',ui-monospace,monospace;font-size:15px;line-height:1.65}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
.app{max-width:780px;margin:0 auto;padding:16px 14px 70px}
.panel{background:var(--navy);border:4px solid var(--paper);box-shadow:6px 6px 0 #000;padding:16px 18px;margin:16px 0}
.panel>h2{margin:0 0 8px;color:var(--gold);font-size:19px}
.panel p{margin:6px 0}
.sub{color:#9fc7a6;font-size:13px}
.btn{font:inherit;cursor:pointer;background:var(--gold);color:var(--ink);border:3px solid #000;padding:9px 14px;margin:6px 8px 6px 0;box-shadow:0 4px 0 #7a5d00;text-align:left}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7a5d00}
.btn.alt{background:var(--paper);box-shadow:0 4px 0 #8a7f5a}
.btn.red{background:var(--red);color:#fff;box-shadow:0 4px 0 #7a2415}
.hud{display:grid;grid-template-columns:1fr auto;gap:6px 14px}
.hud .ovr{grid-row:1/3;grid-column:2;text-align:center;border:3px solid var(--gold);padding:4px 12px;color:var(--gold);font-size:12px}
.hud .ovr b{display:block;font-size:34px;line-height:1.1}
.hud .bars,.hud .meta2{grid-column:1/3}
.row{display:grid;grid-template-columns:4.6em minmax(0,1fr) 2.4em 2.8em;gap:6px;align-items:center;font-size:13px}
.bar{height:12px;border:2px solid var(--paper);background:#06130b}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--gold) 0 6px,#c79a00 6px 8px)}
.grid{display:flex;flex-wrap:wrap}
.news p{color:var(--gold)}
.line{font-size:17px;color:#fff;background:#06130b;border:2px dashed #3d6a4a;padding:8px 10px}
.tag{display:inline-block;background:var(--red);color:#fff;padding:1px 8px;margin:2px 6px 2px 0;font-size:13px;border:2px solid #000}
.tag.g{background:var(--gold);color:var(--ink)}
.title{text-align:center;padding:26px 8px 10px}
.title h1{font-size:clamp(34px,9vw,58px);line-height:1.15;margin:10px 0;color:var(--paper);text-shadow:4px 4px 0 var(--red),8px 8px 0 #000;letter-spacing:-1px}
.title .kicker{color:var(--gold);letter-spacing:4px;font-size:13px}
.blink{animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.25}}
input[type=text],select{font:inherit;width:100%;padding:9px;background:#06130b;color:var(--paper);border:3px solid var(--paper)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.cards label{display:block;border:3px solid var(--paper);padding:8px 10px;cursor:pointer;background:#06130b}
.cards label:has(input:checked){background:var(--gold);color:var(--ink);box-shadow:4px 4px 0 #000}
.cards input{display:none}
.cards small{display:block;opacity:.8}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{border:2px solid #2f5a3b;padding:4px 6px;text-align:left;vertical-align:top}
th{background:#143a24;color:var(--gold)}
.scroll{overflow-x:auto}
.big{font-size:56px;color:var(--gold);text-shadow:4px 4px 0 #000;line-height:1.1}

.narrow{max-width:780px;margin:0 auto}
.app{max-width:1100px}
.topbar{display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--paper);padding-bottom:6px;margin-bottom:6px;color:var(--gold);gap:8px}
.topbar-actions{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.topbar-actions .btn{margin:0;padding:0;font-size:12px;box-shadow:0 3px 0 #7a5d00}
.topbar-actions .btn.icon{width:40px;height:40px;min-width:40px;min-height:40px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.topbar-actions .btn.icon svg{width:20px;height:20px;display:block}
.topbar-actions .btn.icon.coffee{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",emoji,sans-serif;font-size:20px;line-height:1}
.acct{margin:8px 0;padding:10px 12px;text-align:center;font-size:20px;letter-spacing:1px;color:#123f75;background:#fff;border:2px solid #5e91b9;border-radius:8px}
.wbody a{color:#1768b6}
.topbar .hub-logo{display:block;height:40px;width:40px;flex-shrink:0;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.topbar-brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.topbar-name{color:#fff36b;font-weight:700;font-size:15px;line-height:1.15;letter-spacing:-.4px;text-shadow:0 2px #0b315c;white-space:nowrap}
@media(max-width:640px){.topbar-name{font-size:12px}.topbar .hub-logo{height:32px;width:32px}.topbar-actions .btn.icon{width:36px;height:36px;min-width:36px;min-height:36px}}
.prep-backdrop{z-index:55;background:rgba(3,8,5,.72);align-items:flex-start;padding-top:max(12px,env(safe-area-inset-top))}
.prep-win{max-width:520px;width:min(520px,94vw);margin:8vh auto 0;max-height:min(88vh,720px);overflow:auto}.prep-win.res-win{max-width:720px;width:min(720px,96vw)}.res-pay{margin-left:8px;padding:2px 8px;border-radius:10px;background:rgba(24,52,84,.1);font-weight:bold;white-space:nowrap}
.prep-news{margin-bottom:10px;padding:8px 10px;background:#06130b;border-left:4px solid var(--gold);font-size:13px;color:var(--gold)}
.prep-news p{margin:4px 0}
.prep-meta{margin:0 0 10px;font-size:13px}
.prep-chips{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.prep-chips .btn.prep-chip{margin:0;flex:1 1 calc(33% - 10px);min-width:92px;text-align:center;font-size:13px;padding:11px 8px;background:#06130b;color:#b8d4be;border:3px solid #2f5a3b;box-shadow:inset 0 2px 0 rgba(0,0,0,.35);opacity:.92}
.prep-chips .btn.prep-chip.alt{color:#cfe3d0}
.prep-chips .btn.prep-chip.on{background:var(--gold);color:var(--ink);border-color:#fff;opacity:1;box-shadow:0 0 0 3px #fff,0 5px 0 #7a5d00,inset 0 -2px 0 rgba(0,0,0,.15);font-weight:700;transform:translateY(-1px)}
.prep-chips .btn.prep-chip.on::before{content:'✓ ';letter-spacing:1px}
html.no-crt body::after{display:none}
html.rm .blink,.html.rm .title-player,.html.rm .throw-arm,.html.rm .swing-arm,.html.rm .soft-ball,.html.rm .impact,.html.rm .pcard .mobile-chibi{animation:none!important}
html.rm .soft-ball,.html.rm .impact{display:none}
.prep-go{margin-top:14px;text-align:center}
.prep-go .btn.play{width:100%;max-width:360px}
.prep-co{margin:0 0 12px;padding:10px 12px;background:#fff8d6;border:2px solid #e2b000;border-radius:10px;color:#5a4300}
.prep-co .sub{color:#7a6240}
.prep-q{margin:6px 0 4px;font-size:16px;line-height:1.45;color:#3a2a08}
.prep-chips .btn.prep-chip.rec:not(.on){border-color:#e2b000;box-shadow:0 0 0 2px #e2b000,inset 0 2px 0 rgba(0,0,0,.2)}
.plan-steps{display:flex;gap:8px;margin:6px 0 10px}
.plan-steps.long{flex-wrap:wrap;gap:6px}
.plan-steps.long span{flex:1 1 21%;font-size:11px;padding:4px 2px}
.plan-steps span{flex:1;text-align:center;font-size:12px;padding:5px 4px;border:2px solid #6c9ec4;border-radius:8px;color:#526c85;background:#fff}
.plan-steps span.now{background:#ffd43a;color:#513900;border-color:#c99200;font-weight:700}
.plan-steps span.done{background:#d7f0df;color:#1d6b3a;border-color:#3d9a62}
.form-line{margin:0 0 10px;padding:7px 10px;border-radius:8px;color:#fff;font-weight:700;font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.form-line.ok{background:#1f8a45}
.form-line.bad{background:#d23b32}
.row b{text-align:right}
html:lang(en) .row{grid-template-columns:5.6em minmax(0,1fr) 2.4em 2.8em}
.lang-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.lang-pick .btn{margin:0;padding:8px 4px;font-size:13px}
.row em{display:block;min-width:2.6em;font-style:normal;font-weight:700;font-size:12px}
.row em.up,.row em.dn{font-style:normal;font-weight:700;font-size:12px}
.row em.up{color:#1f8a45}
.row em.dn{color:#d23b32}
.delta-note{margin-top:8px;font-weight:700;color:#25425d}
.delta-note .up{color:#1f8a45}
.delta-note .dn{color:#d23b32}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opts .btn.choice{display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%;margin:0;white-space:normal;height:auto;color:#183454;background:#fff;box-shadow:0 0 0 2px #567895,0 3px #3c5d78;animation:none}
.opts .btn.choice b{font-size:15px}
.opts .btn.choice .sub{display:block;font-weight:500;margin-top:2px}
.share-card-row{display:flex;gap:14px;justify-content:center;align-items:stretch;flex-wrap:wrap;margin:8px 0}
.scard{--sc1:#f6c21b;--sc2:#7a5d00;position:relative;flex:0 1 300px;width:min(300px,82vw);aspect-ratio:5/7;overflow:hidden;border:5px solid var(--sc1);border-radius:14px;background:radial-gradient(circle at 50% 34%,color-mix(in srgb,var(--sc1) 34%,transparent),transparent 37%),repeating-linear-gradient(135deg,transparent 0 18px,rgba(255,255,255,.045) 18px 21px),linear-gradient(155deg,var(--sc2),#07170e 58%,#020805);box-shadow:7px 7px 0 #000;min-width:0}
.scard::after{content:"";position:absolute;inset:7px;border:2px solid color-mix(in srgb,var(--sc1) 75%,white);border-radius:9px;pointer-events:none;z-index:5}
.scard-front .scard-visual{position:absolute;z-index:2;inset:12% 4% 24%;display:flex;justify-content:center;align-items:flex-end;overflow:visible}
.scard-front .scard-visual .av{height:100%!important;width:auto!important;aspect-ratio:512/889;max-width:82%}
.scard-top{position:absolute;z-index:3;top:7%;font-weight:900;color:#fff;text-shadow:2px 2px 0 #000;line-height:1.05}
.scard-ovr{left:8%;font-size:13px;text-align:center}.scard-ovr b{display:block;color:var(--sc1);font-size:31px}
.scard-club{right:8%;max-width:48%;font-size:12px;text-align:right}.scard-club b{display:block;color:var(--sc1);font-size:21px}
.scard-bottom{position:absolute;z-index:4;left:7%;right:7%;bottom:6%;padding:7px 11px 9px;background:rgba(3,10,6,.88);border:2px solid var(--sc1);text-align:center}
.scard-name{font-size:18px;color:#fff;line-height:1.2;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard-stats{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:2px 14px}
.scard-stat{display:flex;justify-content:space-between;gap:4px;color:#cfe3d0;font-size:11px}.scard-stat b{color:var(--sc1);font-size:13px}
.scard-back{padding:14% 10%;display:flex;align-items:center;justify-content:center}
.scard-back-inner{position:relative;z-index:2;width:100%}
.scard-back h3{margin:0 0 18px;text-align:center;color:var(--sc1);font-size:18px;letter-spacing:1px}
.scard-cstat{font-size:13px;text-align:left;line-height:1.75;color:#dcecdf}
.scard-cstat p{margin:12px 0;padding:10px;border-top:2px solid var(--sc1);border-bottom:2px solid var(--sc1);background:rgba(0,0,0,.25)}
/* 휴대폰: 앞·뒷면 카드를 작게 줄여 한 줄에 나란히 */
@media(max-width:640px){.share-card-row{flex-wrap:nowrap;gap:6px;align-items:flex-start}.scard{flex:1 1 0;width:0;min-width:0;box-sizing:border-box;border-width:3px;border-radius:10px}.scard::after{inset:4px}
.scard-ovr{font-size:8px}.scard-ovr b{font-size:19px}.scard-club{font-size:7px}.scard-club b{font-size:12px}
.scard-bottom{padding:3px 5px 4px;border-width:1px}.scard-name{font-size:11px;margin-bottom:2px}.scard-stats{gap:0 6px}.scard-stat{font-size:7px}.scard-stat b{font-size:8px}
.scard-back{padding:0}.scard-back-inner{padding:0 9%;box-sizing:border-box}.scard-back h3{font-size:11px;margin:0 0 8px}.scard-cstat{font-size:8px;line-height:1.45}.scard-cstat p{margin:6px 0;padding:5px}}
.share-card-actions{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.share-card-actions .btn{margin:0}
.share-cv-hid{position:fixed;left:-9999px;top:0;opacity:0;pointer-events:none;width:540px;height:756px;overflow:hidden}
.hub-modal .win.wide{max-width:min(760px,96vw)}
.season-news{margin:10px 0;padding:10px 12px;border-left:4px solid var(--gold);background:#123a62;color:#f7fbff;border-radius:8px;font-size:15px;line-height:1.45}
.res-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:12px 0}
.res-top .rec{border:3px solid var(--paper);background:#06130b;padding:8px 10px;text-align:center}
.res-top .rec small{display:block;font-size:11px;color:#9fc7a6;margin-bottom:4px}
.res-top .rec b{display:block;font-size:22px;color:var(--gold);line-height:1.1}
.res-top .rec .gp{display:block;margin-top:6px;font-size:13px;color:#f3e9c6;font-weight:700}
.press-box{margin:10px 0;padding:10px 12px;border:2px solid #8eb4d4;border-radius:8px;background:#f4fbff;color:#183454}
.press-box b{display:block;margin-bottom:4px;color:#1768b6}
.press-box p{margin:4px 0}
.press-box .nick-line{font-weight:700;color:#a15c00}
.hub-modal .win{max-width:420px}
.hub-modal .stg-row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:#06130b;border:3px solid var(--paper);padding:10px 12px;margin:6px 0;color:var(--paper);cursor:pointer}
.hub-modal .stg-row.on{border-color:var(--gold);background:#17402a}
.hub-modal .stg-row small{display:block;color:#9fc7a6;font-size:12px;margin-top:2px}
.hub-modal .stg-sw{width:44px;height:22px;border:2px solid var(--paper);background:#06130b;position:relative;flex-shrink:0}
.hub-modal .stg-sw em{position:absolute;top:2px;left:2px;width:14px;height:14px;background:var(--paper);transition:left .12s}
.hub-modal .stg-row.on .stg-sw em{left:24px;background:var(--gold)}
.share-pre{white-space:pre-wrap;font-size:13px;background:#06130b;border:2px dashed #3d6a4a;padding:10px;margin:10px 0;max-height:160px;overflow:auto}
.hof-banner .hof-flash{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;padding:2px 10px;border-radius:8px;background:#1f8a3b;color:#fff;font-weight:700}.hof-banner .hof-flash.bad{background:#b3261e}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}.hgrid .panel{margin:0}.hp{min-width:0}
.hfield{position:relative;height:300px;border:4px solid var(--paper);background:repeating-linear-gradient(90deg,#1e7a3a 0 44px,#188a35 44px 88px);display:flex;align-items:center;justify-content:center}
.hnum{position:absolute;right:10px;top:6px;color:var(--gold);font-size:20px;text-shadow:2px 2px 0 #000}
